<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" role="img" aria-labelledby="title">
  <title id="title">go-motion-photo extracting the photos and videos of a directory</title>
  <rect x="1" y="1" width="718" height="288" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <path d="M2 36 H718" stroke="#30363d" stroke-width="2"/>
  <circle cx="24" cy="19" r="6" fill="#f85149"/>
  <circle cx="44" cy="19" r="6" fill="#d29922"/>
  <circle cx="64" cy="19" r="6" fill="#3fb950"/>
  <text x="360" y="24" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#7d8590">go-motion-photo</text>
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace" font-size="14" fill="#e6edf3" xml:space="preserve">
    <text x="24" y="68"><tspan fill="#7d8590">$</tspan> <tspan font-weight="bold">go-motion-photo</tspan> ./photos -o ./extracted</text>
    <text x="24" y="92"><tspan fill="#39c5cf">›</tspan> ./photos  <tspan fill="#7d8590">4 files</tspan></text>
    <text x="24" y="116"><tspan fill="#3fb950">✓</tspan> photos/IMG_0001.jpg  photo 2.1 MB<tspan fill="#7d8590"> · </tspan>video 3.4 MB</text>
    <text x="24" y="140"><tspan fill="#3fb950">✓</tspan> photos/IMG_0002.jpg  photo 1.9 MB<tspan fill="#7d8590"> · </tspan>video 2.8 MB</text>
    <text x="24" y="164"><tspan fill="#3fb950">✓</tspan> photos/IMG_0003.jpg  photo 2.4 MB<tspan fill="#7d8590"> · </tspan>video 3.1 MB</text>
    <text x="24" y="212"><tspan fill="#3fb950">✓</tspan> <tspan fill="#3fb950" font-weight="bold">3 extracted</tspan><tspan fill="#7d8590"> · </tspan><tspan fill="#d29922">1 skipped</tspan><tspan fill="#7d8590"> · 0 failed  in 52ms</tspan></text>
    <text x="24" y="236">  3 photos and 3 videos, 15.7 MB, written to ./extracted</text>
    <text x="24" y="260" fill="#7d8590">  1 file without a video skipped, list them with --verbose</text>
  </g>
</svg>
